# VaultSync Local Gateway Nginx Configuration
upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

upstream relay_upstream {
    server relay-server:1234;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Gateway Healthcheck
    location /gateway-healthz {
        access_log off;
        return 200 "GATEWAY_OK\n";
        add_header Content-Type text/plain;
    }

    # WebSocket Blind Relay Reverse Proxy
    location /ws {
        proxy_pass http://relay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Performance & Long-lived Connection Tuning
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Frontend Web SPA Reverse Proxy
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward headers
        proxy_set_header Connection "";
    }
}
