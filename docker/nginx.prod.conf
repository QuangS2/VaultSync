# ==============================================================================
# VaultSync Production Nginx Gateway Configuration (SSL A+ & WebSocket Optimized)
# ==============================================================================

# Upstream Backend Definitions
upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

upstream relay_upstream {
    server relay-server:1234;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server — ACME Challenge, Cloudflare Proxy & Forced HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME Challenge Endpoint for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Gateway Healthcheck (Internal/External probe)
    location /healthz {
        access_log off;
        return 200 "GATEWAY_HTTP_OK\n";
        add_header Content-Type text/plain;
    }

    # WebSocket Zero-Knowledge Blind Relay Reverse Proxy (Hỗ trợ CDN/Edge SSL)
    location /ws {
        proxy_pass http://relay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend Web SPA Reverse Proxy (Tránh Redirect Loop khi dùng Cloudflare/Reverse Proxy)
    location / {
        if ($http_x_forwarded_proto = "https") {
            proxy_pass http://frontend_upstream;
            break;
        }
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — Modern TLS 1.2/1.3, SSL Hardening & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL Certificate & Private Key (Let's Encrypt / Certbot Volume)
    ssl_certificate /etc/letsencrypt/live/vaultsync/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vaultsync/privkey.pem;

    # SSL Protocols & Cipher Suites (Qualys SSL Labs A+ Grade)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (Faster & More Secure TLS Handshake)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Gzip Compression for High-Throughput Asset Delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # --------------------------------------------------------------------------
    # Enterprise Security Headers
    # --------------------------------------------------------------------------
    # HSTS (Strict-Transport-Security: 2 Years with subdomains & preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking protection
    add_header X-Frame-Options "SAMEORIGIN" always;

    # XSS filtering protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrict unneeded browser features (Microphone, Camera, Geolocation)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Content Security Policy (Optimized for WebCrypto, WebWorkers, WASM & WebSockets)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # --------------------------------------------------------------------------
    # Location Routes
    # --------------------------------------------------------------------------

    # Production Healthcheck Endpoint
    location /healthz {
        access_log off;
        return 200 "VAULTSYNC_PROD_OK\n";
        add_header Content-Type text/plain;
    }

    # WebSocket Zero-Knowledge Blind Relay Reverse Proxy
    location /ws {
        proxy_pass http://relay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket Performance Tuning: Disable buffering for instant CRDT sync (<5ms)
        proxy_buffering off;
        proxy_cache off;

        # Long-lived WebSocket timeout (1 hour keepalive)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend Web SPA Reverse Proxy
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Connection "";
    }
}
