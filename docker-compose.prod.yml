# ==============================================================================
# VaultSync — Production Orchestration Stack (Ubuntu Server + Domain + GHCR)
# Run on Production with: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ==============================================================================
name: vaultsync-production

services:
  # 1. Frontend Web SPA Service (Pulled from GitHub Container Registry)
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/quangs2/vaultsync-frontend:latest}
    container_name: vaultsync-frontend-prod
    restart: unless-stopped
    networks:
      - vaultsync_internal
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # 2. WebSocket Blind Relay Server (Pulled from GitHub Container Registry)
  relay-server:
    image: ${RELAY_IMAGE:-ghcr.io/quangs2/vaultsync-server:latest}
    container_name: vaultsync-relay-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=1234
      - HOST=0.0.0.0
      - REDIS_URL=redis://:${REDIS_PASSWORD:-vaultsync_secure_redis_pass}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vaultsync_internal
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M

  # 3. Redis In-Memory Cluster & AOF Persistence
  redis:
    image: redis:7-alpine
    container_name: vaultsync-redis-prod
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-vaultsync_secure_redis_pass} 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru 
      --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - vaultsync_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-vaultsync_secure_redis_pass} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 4. Nginx Reverse Proxy Gateway & SSL Terminator
  gateway:
    image: nginx:1.27-alpine-slim
    container_name: vaultsync-gateway-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      relay-server:
        condition: service_started
    networks:
      - vaultsync_internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # 5. Certbot Auto-Renewal Service
  certbot:
    image: certbot/certbot:latest
    container_name: vaultsync-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - vaultsync_internal

networks:
  vaultsync_internal:
    driver: bridge

volumes:
  redis_prod_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local
